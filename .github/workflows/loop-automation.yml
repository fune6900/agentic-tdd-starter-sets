# ループの ①自動化（Automation）
#
# 人間が毎回コマンドを叩かなくても、ループが起動する仕組み。
# ラベル付与・定期実行をトリガーに Claude Code を起動し、インナーループを回させる。
#
# ⚠ 導入時にやること:
#   1. リポジトリの Secrets に ANTHROPIC_API_KEY を登録する
#      （Claude Code GitHub App を使う場合は CLAUDE_CODE_OAUTH_TOKEN）
#   2. 対象プロジェクトのセットアップコマンド（npm ci 等）を job に合わせて調整する
#   3. 不要なトリガーはコメントアウトする。特に schedule はコストに直結する
#   4. Settings > Actions > General で "Read and write permissions" を有効にする
#
# 安全設計:
#   - 走るのは常にフィーチャーブランチ。main へ直接コミットさせない
#   - ハードストップは .claude/scripts/loop-state.sh が担保する
#   - timeout-minutes でワークフロー側からも強制停止する（二重の歯止め）

name: Loop Automation

on:
  # ① ラベル起動: Issue に `loop:ready` を付けたらインナーループを起動
  issues:
    types: [labeled]

  # ② 手動起動: 任意の Issue 番号を指定して起動
  workflow_dispatch:
    inputs:
      issue_number:
        description: "インナーループを回す Issue 番号"
        required: true
        type: string
      max_retry:
        description: "リトライ上限（既定 3）"
        required: false
        default: "3"
        type: string

  # ③ 定期起動: `loop:ready` が付いた未着手 Issue を拾う
  #    コストが読めるまでは無効のままにしておくこと
  # schedule:
  #   - cron: "0 0 * * 1-5"   # 平日 09:00 JST

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # 同一 Issue に対するループの多重起動を防ぐ
  group: loop-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  inner-loop:
    # ラベル起動時は `loop:ready` のみに反応する
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'loop:ready'
    runs-on: ubuntu-latest

    # ハードストップの二重化。スクリプト側の上限を超えても必ず止まる
    timeout-minutes: 60

    env:
      LOOP_MAX_RETRY: ${{ inputs.max_retry || '3' }}
      LOOP_MAX_MINUTES: "45"
      LOOP_MAX_SAME_GATE_FAIL: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # 対象プロジェクトに合わせて調整する
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "package.json が無い。依存インストールをスキップする。"
          fi

      - name: Resolve issue number
        id: issue
        run: echo "number=${{ github.event.issue.number || inputs.issue_number }}" >> "$GITHUB_OUTPUT"

      - name: Run inner loop
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude Code GitHub App を使う場合は上を消して下を使う:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /issue-flow ${{ steps.issue.outputs.number }}

            追加の制約:
            - .claude/rules/loop-engineering.md のハードストップに必ず従うこと
            - ハードストップに到達した場合はコミット・PR 作成をせず、
              Issue にコメントで状況（リトライ回数・落ちたゲート・推定原因・選択肢）を報告して終了すること
            - main ブランチへ直接コミットしないこと

      - name: Report hard stop
        # ループが halted で終わった場合、Issue にラベルを付けて人間に引き渡す
        if: always()
        run: |
          STATE=".claude/memory/loop-state.json"
          if [ -f "$STATE" ] && [ "$(jq -r '.status' "$STATE")" = "halted" ]; then
            REASON=$(jq -r '.halt_reason' "$STATE")
            gh issue edit "${{ steps.issue.outputs.number }}" \
              --remove-label "loop:ready" --add-label "loop:halted" || true
            gh issue comment "${{ steps.issue.outputs.number }}" \
              --body "⛔ ループがハードストップで停止した。

          **理由**: ${REASON}

          人間の判断が必要。\`/loop-status\` で経緯を確認してから再開すること。

          ---
          _Generated by [Claude Code](https://claude.ai/code)_" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload loop state
        # ハードストップの解析用に状態ファイルを残す（リポジトリにはコミットしない）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-state-${{ steps.issue.outputs.number }}
          path: .claude/memory/loop-state.json
          if-no-files-found: ignore
          retention-days: 7
